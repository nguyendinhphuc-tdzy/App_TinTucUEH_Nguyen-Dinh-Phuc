name: flutter_application_1
description: 'UEH Student app with real Student API integration'
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.1
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.4
  path: ^1.9.1
  mobile_scanner: ^7.0.1
  geolocator: ^13.0.4
  qr_flutter: ^4.1.0
  flutter_widget_from_html_core: ^0.17.4
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - lib/sgds/

flutter_native_splash:
  color: '#004C6D'
  image: assets/img/ueh_splash.png
  android_12:
    color: '#004C6D'
    image: assets/img/ueh_splash.png